<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Python</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f7f8fa;
      color: #111827;
      margin: 0;
      padding-bottom: 60px;
      transition: background 0.2s, color 0.2s;
    }
    body.dark { background: #0f1117; color: #e8eaf0; }
    a { text-decoration: none; }

    nav {
      background: white;
      border-bottom: 1px solid #e2e5ea;
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s, border-color 0.2s;
    }
    body.dark nav { background: #1a1d27; border-bottom-color: #2d3148; }

    .nav-brand { font-weight: 600; font-size: 15px; color: #1F3A5F; }
    body.dark .nav-brand { color: #93b4e0; }

    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-account {
      font-size: 13px;
      font-weight: 500;
      color: #1F3A5F;
      padding: 6px 12px;
      border: 1px solid #e2e5ea;
      border-radius: 8px;
      background: #f7f8fa;
    }
    .nav-account:hover { background: #eef1f5; }
    body.dark .nav-account { color: #93b4e0; border-color: #2d3148; background: #222535; }
    body.dark .nav-account:hover { background: #2d3148; }

    .nav-progress { text-align: right; }
    .nav-progress-label { font-size: 11px; color: #9ca3af; display: block; margin-bottom: 4px; }
    .nav-progress-track {
      width: 140px;
      height: 5px;
      background: #e2e5ea;
      border-radius: 99px;
      overflow: hidden;
    }
    body.dark .nav-progress-track { background: #2d3148; }
    .nav-progress-fill {
      height: 100%;
      background: #16a34a;
      border-radius: 99px;
      transition: width 0.4s;
      width: 0%;
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f0f2f5;
      border: 1px solid #e2e5ea;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4b5563;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .theme-btn:hover { background: #e2e5ea; }
    body.dark .theme-btn { background: #222535; border-color: #2d3148; color: #9da3b4; }
    body.dark .theme-btn:hover { background: #2d3148; }
    body:not(.dark) .moon { display: none; }
    body.dark .sun { display: none; }

    .hero {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px 32px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }
    @media (min-width: 720px) {
      .hero {
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        gap: 36px;
        padding: 48px 24px 36px;
      }
    }
    .hero-brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .hero-brand-row img { width: 40px; height: 40px; }
    .hero-brand {
      font-size: 28px;
      font-weight: 600;
      color: #1F3A5F;
      margin: 0;
      letter-spacing: -0.02em;
      transition: color 0.2s;
    }
    body.dark .hero-brand { color: #93b4e0; }
    .hero h1 {
      font-size: 22px;
      font-weight: 600;
      color: #111827;
      margin: 0 0 10px;
      line-height: 1.3;
      transition: color 0.2s;
    }
    body.dark .hero h1 { color: #e8eaf0; }
    .hero-lead {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.65;
      margin: 0 0 22px;
      max-width: 36em;
      transition: color 0.2s;
    }
    body.dark .hero-lead { color: #9da3b4; }
    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .hero-cta-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 8px;
      background: #1F3A5F;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .hero-cta-primary:hover { background: #162a45; }
    body.dark .hero-cta-primary { background: #3d5a80; }
    body.dark .hero-cta-primary:hover { background: #4a6a94; }
    .hero-cta-secondary {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      color: #1F3A5F;
      padding: 8px 4px;
      transition: color 0.15s;
    }
    .hero-cta-secondary:hover { color: #162a45; }
    body.dark .hero-cta-secondary { color: #93b4e0; }
    body.dark .hero-cta-secondary:hover { color: #b8cce8; }

    .hero-demo {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      overflow: hidden;
      font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
    }
    body:not(.dark) .hero-demo {
      background: #1e2433;
      border-color: #2a3348;
    }
    .hero-demo-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #141722;
      border-bottom: 1px solid #2d3148;
    }
    .hero-demo-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9da3b4;
      font-family: 'DM Sans', sans-serif;
    }
    .hero-demo-run {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #16a34a;
      color: #fff;
      transition: background 0.15s, opacity 0.15s;
    }
    .hero-demo-run:hover:not(:disabled) { background: #15803d; }
    .hero-demo-run:disabled { opacity: 0.65; cursor: default; }
    .hero-demo-code {
      margin: 0;
      padding: 14px 16px;
      color: #d1d5db;
      white-space: pre;
      overflow-x: auto;
      user-select: none;
      pointer-events: none;
    }
    .hero-demo-code .kw { color: #7dd3fc; }
    .hero-demo-code .str { color: #86efac; }
    .hero-demo-out {
      border-top: 1px solid #2d3148;
      padding: 10px 16px 12px;
      min-height: 3.6em;
      color: #e8eaf0;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .hero-demo-out::before {
      content: 'Output';
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .hero-demo-out.is-running::after {
      content: '▋';
      margin-left: 1px;
      animation: hero-caret 0.8s step-end infinite;
      color: #86efac;
    }
    @keyframes hero-caret {
      50% { opacity: 0; }
    }

    .course {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .unit {
      background: white;
      border: 1px solid #e2e5ea;
      border-radius: 12px;
      overflow: hidden;
      transition: background 0.2s, border-color 0.2s;
    }
    body.dark .unit { background: #1a1d27; border-color: #2d3148; }

    .unit-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e2e5ea;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }
    body.dark .unit-header { border-bottom-color: #2d3148; }

    .unit-header small {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #9ca3af;
      display: block;
      margin-bottom: 2px;
    }
    .unit-header strong { font-size: 15px; color: #1F3A5F; transition: color 0.2s; }
    body.dark .unit-header strong { color: #93b4e0; }
    .unit-progress { font-size: 12px; color: #9ca3af; flex-shrink: 0; }

    .unit a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 20px;
      border-bottom: 1px solid #f0f2f5;
      color: #111827;
      font-size: 14px;
      transition: background 0.1s, color 0.2s, border-color 0.2s;
    }
    body.dark .unit a { color: #9da3b4; border-bottom-color: #222535; }
    .unit a:last-child { border-bottom: none; }
    .unit a:hover { background: #f7f8fa; }
    body.dark .unit a:hover { background: #222535; }
    .unit a.locked { opacity: .55; }
    .unit a.lesson-done { background: #f0fdf4; }
    body.dark .unit a.lesson-done { background: #0d1f13; }
    .unit a.lesson-done .num { background: #bbf7d0; color: #15803d; border-color: #86efac; }
    body.dark .unit a.lesson-done .num { background: #1a3326; color: #4ade80; border-color: #1f4433; }

    .num {
      width: 44px;
      height: 26px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    body.dark .num { background: #172038; color: #93c5fd; border-color: #1e3a5f; }

    .unit a span { flex: 1; }
    .unit a svg { color: #d1d5db; transition: color 0.1s; }
    .unit a:hover svg { color: #2563eb; }

    #continue-slot {
      max-width: 680px;
      margin: 0 auto 24px;
      padding: 0 24px;
    }
    .continue-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      color: #1d4ed8;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .continue-card:hover {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1F3A5F;
    }
    body.dark .continue-card {
      background: #172038;
      border-color: #1e3a5f;
      color: #93c5fd;
    }
    body.dark .continue-card:hover {
      background: #1e3a5f;
      border-color: #2563eb;
      color: #93b4e0;
    }
    .continue-card-text { flex: 1; }
    .continue-card svg { flex-shrink: 0; }

    #streak-slot:empty,
    #streak-slot[hidden] { display: none; }
    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 500;
      color: #c2410c;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 8px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }
    body.dark .streak-badge {
      color: #fdba74;
      background: #1c1410;
      border-color: #7c2d12;
    }
    .streak-flame {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border-radius: 50% 50% 50% 0;
      background: linear-gradient(135deg, #f97316, #ea580c);
      transform: rotate(-45deg);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2);
    }
    body.dark .streak-flame {
      background: linear-gradient(135deg, #fb923c, #f97316);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.25);
    }
    .streak-text { letter-spacing: 0.01em; }

  </style>
</head>
<body>

<nav>
  <span class="nav-brand">Learn Python</span>
  <div class="nav-right">
    <div id="streak-slot"></div>
    <div class="nav-progress">
      <span class="nav-progress-label" id="overall-label"></span>
      <div class="nav-progress-track">
        <div class="nav-progress-fill" id="overall-fill"></div>
      </div>
    </div>
    <a href="signup.html" class="nav-account" id="nav-account">Create account</a>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle dark mode">
      <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</nav>

<div class="hero">
  <div class="hero-copy">
    <div class="hero-brand-row">
      <img src="https://s3.dualstack.us-east-2.amazonaws.com/pythondotorg-assets/media/community/logos/python-logo-only.png" alt="">
      <p class="hero-brand">Learn Python</p>
    </div>
    <h1>Write your first program today — free</h1>
    <p class="hero-lead">Start in the browser with Lesson 1. No install. Account optional if you want to save progress.</p>
    <div class="hero-ctas">
      <a class="hero-cta-primary" href="lesson.html?unit=1&lesson=1">Start lesson 1</a>
      <a class="hero-cta-secondary" href="signup.html">Create account (optional)</a>
    </div>
  </div>
  <div class="hero-demo" aria-label="Try a tiny Python example">
    <div class="hero-demo-bar">
      <span class="hero-demo-label">Try it</span>
      <button type="button" class="hero-demo-run" id="hero-demo-run">Run</button>
    </div>
    <pre class="hero-demo-code" aria-hidden="true"><span class="kw">print</span>(<span class="str">"Hello!"</span>)
<span class="kw">print</span>(<span class="str">"You can code."</span>)</pre>
    <div class="hero-demo-out" id="hero-demo-output" role="status" aria-live="polite"></div>
  </div>
</div>

<div id="continue-slot"></div>

<main class="course" id="course"></main>
<div id="certificates-slot"></div>

<script src="js/hero-demo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="course-info.js"></script>
<script src="js/continue-lesson.js"></script>
<script src="js/certificates.js"></script>
<script src="js/streaks.js"></script>
<script>
  renderContinue('continue-slot');

  const { createClient } = supabase;
  const db = createClient('https://udzpwekkpedmtudcsyve.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkenB3ZWtrcGVkbXR1ZGNzeXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzAzMjYsImV4cCI6MjA5NjYwNjMyNn0.xaMqyzNabeeE7bYVbAVwz8HCFIwQrGczF9x1FrXJv-A');

  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

  document.getElementById('course').innerHTML = units.map(unit => `
    <div class="unit">
      <div class="unit-header">
        <div>
          <small>Unit ${unit.number}</small>
          <strong>${unit.title}</strong>
        </div>
        <span class="unit-progress" id="unit-progress-${unit.number}"></span>
      </div>
      ${unit.lessons.map(lesson => `
        <a href="lesson.html?unit=${unit.number}&lesson=${lesson.number}">
          <span class="num">${unit.number}.${lesson.number}</span>
          <span>${lesson.title}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </a>`).join('')}
    </div>`).join('');

  function applyCompletions(completed) {
    const totalLessons = units.reduce((sum, unit) => sum + unit.lessons.length, 0);
    document.getElementById('overall-fill').style.width = `${Math.round(completed.length / totalLessons * 100)}%`;
    document.getElementById('overall-label').textContent = `${completed.length} / ${totalLessons} lessons`;

    units.forEach(unit => {
      const unitDone = unit.lessons.filter(l => completed.includes(`${unit.number}-${l.number}`)).length;
      document.getElementById(`unit-progress-${unit.number}`).textContent = `${unitDone} / ${unit.lessons.length}`;

      unit.lessons.forEach(lesson => {
        if (completed.includes(`${unit.number}-${lesson.number}`)) {
          const link = document.querySelector(`a[href="lesson.html?unit=${unit.number}&lesson=${lesson.number}"]`);
          if (link) link.classList.add('lesson-done');
        }
      });
    });
    if (typeof refreshCertificates === 'function') refreshCertificates(completed);
  }

  (async () => {
    const { data: { session } } = await db.auth.getSession();
    const accountLink = document.getElementById('nav-account');

    if (!session) {
      accountLink.href = 'signup.html';
      accountLink.textContent = 'Create account';
      document.getElementById('overall-label').textContent = 'All lessons free — account optional to save progress';
      let guest = [];
      try { guest = JSON.parse(localStorage.getItem('guest-completions') || '[]'); } catch {}
      if (guest.length) applyCompletions(guest);
      return;
    }

    accountLink.href = 'login.html';
    accountLink.textContent = 'Account';
    const { data: completionRows } = await db.from('completions').select('unit, lesson');
    const completed = completionRows ? completionRows.map(r => `${r.unit}-${r.lesson}`) : [];
    applyCompletions(completed);
  })();

</script>

</body>
</html>

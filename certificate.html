<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate — Learn Python</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1F3A5F;
      --navy-mid: #2a4d7a;
      --ink: #1a2332;
      --muted: #5b6575;
      --line: #c5d0e0;
      --paper: #fafbfc;
      --cream: #f3f6fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(160deg, #e8eef5 0%, #f7f8fa 45%, #eef2f7 100%);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    .toolbar {
      max-width: 820px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
    }

    .toolbar-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .back {
      font-size: 13px;
      font-weight: 500;
      color: var(--navy);
      text-decoration: none;
    }
    .back:hover { text-decoration: underline; }

    .name-field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .name-field input {
      font-family: inherit;
      font-size: 14px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-width: 160px;
      background: white;
      color: var(--ink);
    }
    .name-field input:focus {
      outline: none;
      border-color: var(--navy);
    }

    .print-btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--navy);
      color: white;
      cursor: pointer;
    }
    .print-btn:hover { background: var(--navy-mid); }

    .cert-wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    .certificate {
      position: relative;
      background: var(--paper);
      border: 2px solid var(--navy);
      padding: 48px 40px 40px;
      box-shadow: 0 12px 40px rgba(31, 58, 95, 0.12);
      overflow: hidden;
    }

    .certificate::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid var(--line);
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 36px;
      height: 36px;
      border-color: var(--navy);
      border-style: solid;
      opacity: 0.55;
      z-index: 1;
    }
    .corner-tl { top: 18px; left: 18px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 18px; right: 18px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 18px; left: 18px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 18px; right: 18px; border-width: 0 2px 2px 0; }

    .band {
      height: 6px;
      background: linear-gradient(90deg, var(--navy) 0%, #4a6f9a 50%, var(--navy) 100%);
      margin: 0 0 36px;
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--navy);
      margin: 0 0 8px;
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 20px;
      position: relative;
      z-index: 1;
    }

    .headline {
      text-align: center;
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 700;
      color: var(--navy);
      margin: 0 0 28px;
      line-height: 1.15;
      position: relative;
      z-index: 1;
    }

    .awarded {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 8px;
      position: relative;
      z-index: 1;
    }

    .recipient {
      text-align: center;
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 6px;
      min-height: 1.2em;
      border-bottom: 1.5px solid var(--line);
      display: inline-block;
      min-width: 220px;
      padding: 0 12px 6px;
      position: relative;
      z-index: 1;
    }

    .recipient-row {
      text-align: center;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .achievement {
      text-align: center;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      max-width: 520px;
      margin: 0 auto 32px;
      position: relative;
      z-index: 1;
    }
    .achievement strong {
      color: var(--navy);
      font-weight: 600;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 8px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      position: relative;
      z-index: 1;
    }

    .meta-block {
      font-size: 12px;
      color: var(--muted);
    }
    .meta-block span {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
      margin-top: 4px;
    }

    .seal {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      background: var(--cream);
      flex-shrink: 0;
    }
    .seal svg { color: var(--navy); }

    .error-state {
      max-width: 480px;
      margin: 48px auto;
      text-align: center;
      padding: 32px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .error-state h1 {
      font-size: 20px;
      color: var(--navy);
      margin: 0 0 8px;
    }
    .error-state p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }
      .toolbar { display: none !important; }
      .cert-wrap { max-width: none; }
      .certificate {
        box-shadow: none;
        border-width: 2px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <div class="toolbar-left">
    <a class="back" href="index.html">← Back to course</a>
    <label class="name-field">
      Your name
      <input type="text" id="cert-name-input" placeholder="Optional" maxlength="80" autocomplete="name">
    </label>
  </div>
  <button type="button" class="print-btn" onclick="window.print()">Print / Save PDF</button>
</div>

<div class="cert-wrap" id="cert-root"></div>

<script src="course-info.js"></script>
<script src="js/certificates.js"></script>
<script>
  const CERT_NAME_KEY = 'cert-name';

  function loadName() {
    return localStorage.getItem(CERT_NAME_KEY) || '';
  }

  function saveName(value) {
    localStorage.setItem(CERT_NAME_KEY, value);
  }

  function formatDate(d) {
    return d.toLocaleDateString(undefined, {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
  }

  function parseParams() {
    const params = new URLSearchParams(window.location.search);
    const unitRaw = params.get('unit');
    const courseRaw = params.get('course');
    if (courseRaw === '1' || courseRaw === 'true') {
      return { type: 'course' };
    }
    if (unitRaw != null && unitRaw !== '') {
      const n = parseInt(unitRaw, 10);
      if (!Number.isNaN(n)) return { type: 'unit', unit: n };
    }
    return { type: 'invalid' };
  }

  function findUnit(num) {
    return units.find(u => u.number === num) || null;
  }

  function sealSVG() {
    return `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
      <path d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.3 7.2 17l.9-5.4L4.2 7.7l5.4-.8L12 2z"/>
    </svg>`;
  }

  function renderCertificate({ titleLine, achievementHTML }) {
    const name = loadName();
    const displayName = name.trim() || 'Learner';
    return `
      <article class="certificate" aria-label="Certificate">
        <span class="corner corner-tl" aria-hidden="true"></span>
        <span class="corner corner-tr" aria-hidden="true"></span>
        <span class="corner corner-bl" aria-hidden="true"></span>
        <span class="corner corner-br" aria-hidden="true"></span>
        <div class="band" aria-hidden="true"></div>
        <p class="brand">Learn Python</p>
        <p class="eyebrow">Certificate of completion</p>
        <h1 class="headline">${titleLine}</h1>
        <p class="awarded">Presented to</p>
        <div class="recipient-row">
          <span class="recipient" id="cert-recipient">${escapeHtml(displayName)}</span>
        </div>
        <p class="achievement">${achievementHTML}</p>
        <div class="meta">
          <div class="meta-block">
            Date
            <span>${formatDate(new Date())}</span>
          </div>
          <div class="meta-block">
            Course
            <span>Learn Python</span>
          </div>
          <div class="seal" title="Learn Python">${sealSVG()}</div>
        </div>
      </article>
    `;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderError(message) {
    document.getElementById('cert-root').innerHTML = `
      <div class="error-state">
        <h1>Certificate not found</h1>
        <p>${escapeHtml(message)}</p>
        <a class="back" href="index.html">Back to course</a>
      </div>
    `;
  }

  function syncRecipient() {
    const el = document.getElementById('cert-recipient');
    if (!el) return;
    const name = document.getElementById('cert-name-input').value.trim();
    el.textContent = name || 'Learner';
  }

  const mode = parseParams();
  const root = document.getElementById('cert-root');
  const nameInput = document.getElementById('cert-name-input');
  nameInput.value = loadName();
  nameInput.addEventListener('input', () => {
    saveName(nameInput.value);
    syncRecipient();
  });

  if (mode.type === 'course') {
    document.title = 'Course Certificate — Learn Python';
    root.innerHTML = renderCertificate({
      titleLine: 'Course Complete',
      achievementHTML: 'for completing every unit in <strong>Learn Python</strong> — from first programs through classes.'
    });
  } else if (mode.type === 'unit') {
    const unit = findUnit(mode.unit);
    if (!unit) {
      renderError(`There is no Unit ${mode.unit} in this course.`);
    } else {
      document.title = `Unit ${unit.number} Certificate — Learn Python`;
      root.innerHTML = renderCertificate({
        titleLine: `Unit ${unit.number}`,
        achievementHTML: `for completing <strong>Unit ${unit.number}: ${escapeHtml(unit.title)}</strong> in Learn Python.`
      });
    }
  } else {
    renderError('Open a certificate from the course page, or use ?unit=N or ?course=1.');
  }
</script>

</body>
</html>
